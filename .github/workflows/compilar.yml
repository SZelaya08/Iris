name: Compilar Iris

# Se ejecuta cada vez que haces push a la rama main,
# o a mano desde la pestaña Actions de GitHub ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: macos-15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto de Xcode
        run: xcodegen generate

      - name: Compilar la app (sin firmar)
        run: |
          set -o pipefail
          xcodebuild \
            -project Iris.xcodeproj \
            -scheme Iris \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: Firmar en modo ad hoc con los permisos del widget
        run: |
          APP="build/Build/Products/Release-iphoneos/Iris.app"
          codesign -f -s - --entitlements IrisWidget/IrisWidget.entitlements "$APP/PlugIns/IrisWidget.appex"
          codesign -f -s - --entitlements Iris/Iris.entitlements "$APP"

      - name: Empaquetar el .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Iris.app Payload/
          zip -qry Iris.ipa Payload

      - name: Subir el .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Iris-ipa
          path: Iris.ipa
          retention-days: 14
