name: Iris

options:
  bundleIdPrefix: com.taliana
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.3"
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""

targets:
  Iris:
    type: application
    platform: iOS
    sources:
      - path: Iris
      - path: Shared
    info:
      path: Iris/Info.plist
      properties:
        CFBundleDisplayName: Iris
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - es
        NSRemindersFullAccessUsageDescription: Iris guarda tus tareas en una lista llamada Iris en Recordatorios para mostrarlas en tu pantalla de bloqueo.
        NSRemindersUsageDescription: Iris guarda tus tareas en una lista llamada Iris en Recordatorios para mostrarlas en tu pantalla de bloqueo.
        CFBundleURLTypes:
          - CFBundleURLName: com.taliana.iris
            CFBundleURLSchemes:
              - iris
    # Archivo de permisos vacío: GitHub lo usa al firmar, Sideloadly lo reemplaza al instalar.
    entitlements:
      path: Iris/Iris.entitlements
      properties:
        com.apple.security.application-groups: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taliana.iris
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: IrisWidget

  IrisWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: IrisWidget
      - path: Shared
    info:
      path: IrisWidget/Info.plist
      properties:
        CFBundleDisplayName: Iris
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSRemindersFullAccessUsageDescription: El widget de Iris muestra las tareas de tu lista Iris en Recordatorios.
        NSRemindersUsageDescription: El widget de Iris muestra las tareas de tu lista Iris en Recordatorios.
    entitlements:
      path: IrisWidget/IrisWidget.entitlements
      properties:
        com.apple.security.application-groups: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taliana.iris.widget

schemes:
  Iris:
    build:
      targets:
        Iris: all
        IrisWidget: all
