name: Iris

options:
  bundleIdPrefix: com.taliana
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""

targets:
  Iris:
    type: application
    platform: iOS
    sources:
      - path: Iris
      - path: Shared
    info:
      path: Iris/Info.plist
      properties:
        CFBundleDisplayName: Iris
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.taliana.iris
            CFBundleURLSchemes:
              - iris
    entitlements:
      path: Iris/Iris.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.taliana.iris
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taliana.iris
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: IrisWidget

  IrisWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: IrisWidget
      - path: Shared
    info:
      path: IrisWidget/Info.plist
      properties:
        CFBundleDisplayName: Iris
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: IrisWidget/IrisWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.taliana.iris
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taliana.iris.widget

schemes:
  Iris:
    build:
      targets:
        Iris: all
        IrisWidget: all
